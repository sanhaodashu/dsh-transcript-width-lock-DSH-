<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="dsh-transcript-width-lock">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#2f81f7"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="20" fill="none" stroke="#30363d"/>

  <!-- left handle -->
  <rect x="150" y="70" width="10" height="180" rx="5" fill="url(#bar)"/>
  <!-- right handle -->
  <rect x="1040" y="70" width="10" height="180" rx="5" fill="url(#bar)"/>

  <!-- lock on left handle -->
  <g transform="translate(118,150)" fill="none" stroke="#2f81f7" stroke-width="6" stroke-linecap="round">
    <rect x="0" y="14" width="34" height="26" rx="5" fill="#1f6feb" stroke="none"/>
    <path d="M7 14 v-6 a10 10 0 0 1 20 0 v6"/>
  </g>
  <!-- lock on right handle -->
  <g transform="translate(1048,150)" fill="none" stroke="#2f81f7" stroke-width="6" stroke-linecap="round">
    <rect x="0" y="14" width="34" height="26" rx="5" fill="#1f6feb" stroke="none"/>
    <path d="M7 14 v-6 a10 10 0 0 1 20 0 v6"/>
  </g>

  <!-- central text column -->
  <rect x="250" y="70" width="700" height="180" rx="14" fill="#0f141b" stroke="#30363d"/>
  <g fill="#30363d">
    <rect x="300" y="108" width="600" height="12" rx="6"/>
    <rect x="300" y="138" width="560" height="12" rx="6"/>
    <rect x="300" y="168" width="600" height="12" rx="6"/>
    <rect x="300" y="198" width="420" height="12" rx="6"/>
  </g>

  <!-- title -->
  <text x="600" y="285" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3">dsh-transcript-width-lock</text>
</svg>
